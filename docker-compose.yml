version: '3.8'

services:
  app:
    # Build the image from the Dockerfile in the current directory
    build: .
    # Name the container for easier management
    container_name: my-generic-app
    # Restart policy for resilience
    restart: unless-stopped
    # You can map ports here if your application has any
    # For example, to map port 8080 on the host to port 80 in the container:
    # ports:
    #   - "8080:80"
